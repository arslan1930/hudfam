databases:
  - name: hudfam-db
    plan: free
    databaseName: hudfam
    user: hudfam

services:
  - type: web
    name: hudfam
    runtime: python
    plan: free
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SEED_DEMO
        value: "1"
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: hudfam-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.3"
