{% extends "base.html" %}
{% block body %}
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="{% url 'team_dashboard' %}">Hudfam</a>
    <nav>
      <a href="{% url 'team_dashboard' %}">Dashboard</a>
      <a href="{% url 'team_projects' %}">My projects</a>
      <a href="{% url 'team_sites' %}">Sites</a>
      <a href="{% url 'team_site_create' %}">Add site</a>
      <a href="{% url 'team_results' %}">Results feed</a>
      <a href="{% url 'logout' %}">Logout</a>
    </nav>
  </aside>
  <main class="main">
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
