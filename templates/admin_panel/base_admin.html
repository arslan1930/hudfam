{% extends "base.html" %}
{% block body %}
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="{% url 'admin_dashboard' %}">Hudfam</a>
    <nav>
      <a href="{% url 'admin_dashboard' %}">Dashboard</a>
      <a href="{% url 'admin_projects' %}">Projects</a>
      <a href="{% url 'admin_sites' %}">Sites</a>
      <a href="{% url 'admin_published' %}">Published</a>
      <a href="{% url 'admin_import' %}">Import Excel</a>
      <a href="{% url 'admin_users' %}">Users</a>
      <a href="{% url 'logout' %}">Logout</a>
    </nav>
  </aside>
  <main class="main">
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
