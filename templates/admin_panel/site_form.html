{% extends "admin_panel/base_admin.html" %}
{% block title %}{{ title }} · Hudfam{% endblock %}
{% block content %}
<div class="topbar"><div><h1>{{ title }}</h1></div></div>
<div class="card">
  <form method="post">
    {% csrf_token %}
    <div class="form-grid">
      {% for field in form %}
      <div class="{% if field.name in 'outreach_notes warning_flags' %}full{% endif %}">
        <label>{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="help" style="color:var(--bad)">{{ error }}</div>{% endfor %}
      </div>
      {% endfor %}
    </div>
    <p class="actions" style="margin-top:1rem">
      <button class="btn" type="submit">Save</button>
      <a class="btn secondary" href="{% url 'admin_sites' %}">Cancel</a>
    </p>
  </form>
</div>
{% endblock %}
