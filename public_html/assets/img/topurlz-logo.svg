<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-label="topUrlz">
  <defs>
    <linearGradient id="tuBg" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF7E00"/>
      <stop offset="50%" stop-color="#FF4B2B"/>
      <stop offset="100%" stop-color="#FF2D55"/>
    </linearGradient>
    <linearGradient id="tuArrow" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#00A800"/>
      <stop offset="100%" stop-color="#00D000"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="520" height="140" rx="28" ry="28" fill="url(#tuBg)"/>
