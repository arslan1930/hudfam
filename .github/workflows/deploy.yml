# Safe Hostinger deploy: lint PHP, then lftp mirror ONLY public_html/ → document root.
# Never deletes remote files (no --delete). Never uploads config.php or uploads/.
#
# FTPS note: Hostinger often needs FTP over TLS with an unverified cert from CI.
# We set ssl:verify-certificate no as an explicit fallback (traffic is still TLS when
# the server offers it; ftp:ssl-allow true). Prefer fixing the host cert if possible.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-deploy:
    name: Lint and FTP deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check (public_html)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find public_html -type f -name '*.php' -print0 | sort -z)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No PHP files under public_html/" >&2
            exit 1
          fi
          echo "Checking ${#files[@]} PHP files…"
          for f in "${files[@]}"; do
            php -l "$f"
          done

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: lftp mirror public_html/ to document root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Optional; default document root. Prefer a path ending with /.
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          if [[ -z "${FTP_SERVER:-}" || -z "${FTP_USERNAME:-}" || -z "${FTP_PASSWORD:-}" ]]; then
            echo "Missing required secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD" >&2
            exit 1
          fi

          # Trim accidental whitespace/CRLF from GitHub secrets.
          trim() { echo -n "$1" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          FTP_SERVER="$(trim "$FTP_SERVER")"
          FTP_USERNAME="$(trim "$FTP_USERNAME")"
          FTP_PASSWORD="$(trim "$FTP_PASSWORD")"
          REMOTE_DIR="$(trim "${FTP_SERVER_DIR:-./}")"
          if [[ -z "${REMOTE_DIR}" ]]; then
            REMOTE_DIR="./"
          fi

          echo "FTP host=${FTP_SERVER} user_len=${#FTP_USERNAME} pass_len=${#FTP_PASSWORD} remote=${REMOTE_DIR}"

          # netrc keeps passwords with commas/special chars out of open -u parsing.
          LFTP_HOME="$(mktemp -d)"
          cleanup() { rm -rf "$LFTP_HOME"; }
          trap cleanup EXIT
          {
            printf 'machine %s\n' "$FTP_SERVER"
            printf 'login %s\n' "$FTP_USERNAME"
            printf 'password %s\n' "$FTP_PASSWORD"
          } > "$LFTP_HOME/.netrc"
          chmod 600 "$LFTP_HOME/.netrc"

          # SSL settings must be applied before open (do not pass host on argv).
          HOME="$LFTP_HOME" lftp <<EOF
          set cmd:fail-exit true
          set net:max-retries 5
          set net:persist-retries 3
          set net:timeout 60
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          set net:reconnect-interval-max 60
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          set ftp:list-options -a
          set mirror:parallel-transfer-count 2
          open ftp://${FTP_SERVER}
          cd ${REMOTE_DIR}
          lcd public_html
          mirror --reverse --only-newer --parallel=2 --verbose --exclude-glob config.php --exclude-glob uploads --exclude-glob uploads/** --exclude-glob .git* --exclude-glob **/.git* --exclude-glob **/.git*/**
          bye
          EOF
