# Safe Hostinger deploy: lint PHP, then lftp mirror ONLY public_html/ → document root.
# Never deletes remote files (no --delete). Never uploads config.php or uploads/.
#
# FTPS note: Hostinger often needs FTP over TLS with an unverified cert from CI.
# We set ssl:verify-certificate no as an explicit fallback (traffic is still TLS when
# the server offers it; ftp:ssl-allow true). Prefer fixing the host cert if possible.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-deploy:
    name: Lint and FTP deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check (public_html)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find public_html -type f -name '*.php' -print0 | sort -z)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No PHP files under public_html/" >&2
            exit 1
          fi
          echo "Checking ${#files[@]} PHP files…"
          for f in "${files[@]}"; do
            php -l "$f"
          done

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: lftp mirror public_html/ to document root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Optional; default document root. Prefer a path ending with /.
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          if [[ -z "${FTP_SERVER:-}" || -z "${FTP_USERNAME:-}" || -z "${FTP_PASSWORD:-}" ]]; then
            echo "Missing required secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD" >&2
            exit 1
          fi
          REMOTE_DIR="${FTP_SERVER_DIR:-./}"
          if [[ -z "${REMOTE_DIR// }" ]]; then
            REMOTE_DIR="./"
          fi

          # lftp reads LFTP_PASSWORD when -u has no password (keeps it out of argv).
          export LFTP_PASSWORD="$FTP_PASSWORD"

          lftp <<EOF
          set cmd:fail-exit true
          set net:max-retries 10
          set net:persist-retries 5
          set net:timeout 60
          set net:reconnect-interval-base 10
          set net:reconnect-interval-multiplier 2
          set net:reconnect-interval-max 120
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          set ftp:list-options -a
          set mirror:parallel-transfer-count 2
          open -u ${FTP_USERNAME} ftp://${FTP_SERVER}
          cd ${REMOTE_DIR}
          lcd public_html
          mirror --reverse --only-newer --parallel=2 --verbose --exclude-glob config.php --exclude-glob uploads --exclude-glob uploads/** --exclude-glob .git* --exclude-glob **/.git* --exclude-glob **/.git*/**
          bye
          EOF
