# Safe Hostinger deploy: lint PHP, then lftp mirror ONLY public_html/ → document root.
# Never deletes remote files (no --delete). Never uploads config.php or uploads/.
#
# FTPS note: Prefer `ftp:ssl-allow true` + `ssl:verify-certificate no` (Hostinger certs
# often do not match the FTP hostname from GitHub runners). If AUTH TLS login returns
# 530, we fall back once to clear FTP (`ftp:ssl-allow false`) — the same mode the
# previous basic-ftp client used successfully against this host.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-deploy:
    name: Lint and FTP deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check (public_html)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find public_html -type f -name '*.php' -print0 | sort -z)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No PHP files under public_html/" >&2
            exit 1
          fi
          echo "Checking ${#files[@]} PHP files…"
          for f in "${files[@]}"; do
            php -l "$f"
          done

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: lftp mirror public_html/ to document root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Optional; default document root. Prefer a path ending with /.
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re, subprocess, sys, tempfile
          from pathlib import Path

          def trim(s: str) -> str:
              return re.sub(r"\s+$", "", re.sub(r"^\s+", "", (s or "").replace("\r", "")))

          host = trim(os.environ.get("FTP_SERVER", ""))
          user = trim(os.environ.get("FTP_USERNAME", ""))
          password = trim(os.environ.get("FTP_PASSWORD", ""))
          remote = trim(os.environ.get("FTP_SERVER_DIR") or "./") or "./"
          if not host or not user or not password:
              print("Missing required secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD", file=sys.stderr)
              sys.exit(1)

          print(f"FTP host={host} user_len={len(user)} pass_len={len(password)} remote={remote}")

          def lftp_quote(s: str) -> str:
              return '"' + s.replace("\\", "\\\\").replace('"', '\\"') + '"'

          excludes = (
              "--exclude-glob config.php "
              "--exclude-glob uploads "
              "--exclude-glob uploads/** "
              "--exclude-glob .git* "
              "--exclude-glob **/.git* "
              "--exclude-glob **/.git*/**"
          )

          def script(ssl_allow: bool) -> str:
              ssl = "true" if ssl_allow else "false"
              return f"""
          set cmd:fail-exit true
          set net:max-retries 5
          set net:persist-retries 3
          set net:timeout 60
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          set net:reconnect-interval-max 60
          set ftp:passive-mode true
          set ftp:ssl-allow {ssl}
          set ssl:verify-certificate no
          set ftp:list-options -a
          set mirror:parallel-transfer-count 2
          open ftp://{host}
          user {lftp_quote(user)} {lftp_quote(password)}
          cd {lftp_quote(remote)}
          lcd public_html
          mirror --reverse --only-newer --parallel=2 --verbose {excludes}
          bye
          """

          def run_lftp(ssl_allow: bool) -> int:
              mode = "TLS allowed" if ssl_allow else "clear FTP (ssl-allow false)"
              print(f"==> lftp mirror ({mode})")
              with tempfile.NamedTemporaryFile("w", suffix=".lftp", delete=False) as fh:
                  fh.write(script(ssl_allow))
                  path = fh.name
              try:
                  proc = subprocess.run(["lftp", "-f", path], text=True)
                  return proc.returncode
              finally:
                  Path(path).unlink(missing_ok=True)

          # Preferred: TLS when the server offers it (verify-certificate no fallback).
          rc = run_lftp(True)
          if rc == 0:
              sys.exit(0)

          print(
              "TLS/login attempt failed; retrying once with ftp:ssl-allow false "
              "(Hostinger often accepts plain FTP on :21 from CI).",
              file=sys.stderr,
          )
          rc = run_lftp(False)
          sys.exit(rc)
          PY
