name: PHP lint and smoke

on:
  push:
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax check
        run: find public_html tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Smoke test (no database)
        run: php tests/smoke_admin_mvp.php
